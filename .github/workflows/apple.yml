# iPhone + Apple Watch app (apple/): generate the Xcode project with XcodeGen, build on a GitHub-hosted Mac,
# and (when asked and the App Store Connect secrets are set) sign and upload to App Store Connect / TestFlight.
# The repository is public, so standard GitHub-hosted runners (macOS included) are free.
#
# - Pushes that touch apple/ only compile (no signing, nothing uploaded).
# - Run by hand with upload=true to sign and upload (Xcode cloud signing with the API key).
#   Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's text), APPLE_TEAM_ID. See docs/ios-testflight.md.
name: Apple build

on:
  push:
    branches: [main]
    paths:
      - "apple/**"
      - "web/voices/**"
      - "web/voice-words.json"
      - "web/img/dogs/**"
      - "docs/art/icon/**"
      - "tools/make_apple_assets.sh"
      - ".github/workflows/apple.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload to App Store Connect (TestFlight)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail, so a failing xcodebuild is not hidden by "| tail"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
      HAS_SIGNING: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iOS|watchOS" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make asset catalogs and the Xcode project
        run: |
          bash tools/make_apple_assets.sh
          xcodegen generate --spec apple/project.yml
          ls apple

      - name: Compile only (no signing)
        if: env.UPLOAD != 'true' || env.HAS_SIGNING != 'true'
        working-directory: apple
        run: |
          if [ "$UPLOAD" = "true" ]; then echo "::warning::Upload asked but the App Store Connect secrets are not set: compiling only"; fi
          xcodebuild build -project PickleCall.xcodeproj -scheme PickleCall -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath ../derived \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -n 150

      - name: Prepare the App Store Connect key
        if: env.UPLOAD == 'true' && env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive, sign and upload to App Store Connect
        if: env.UPLOAD == 'true' && env.HAS_SIGNING == 'true'
        working-directory: apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          # Archive unsigned (automatic signing of a Release archive would ask for a development profile, which needs
          # a registered device), then let the export sign the app and its Watch app for the App Store.
          xcodebuild archive -project PickleCall.xcodeproj -scheme PickleCall -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ../build/PickleCall.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -n 150
          ls ../build/PickleCall.xcarchive/Products/Applications/*/Watch || true
          cat > ../build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath ../build/PickleCall.xcarchive \
            -exportOptionsPlist ../build/ExportOptions.plist -exportPath ../build/export $AUTH 2>&1 | tail -n 150
          echo "Uploaded build $BUILD_NUMBER"

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
