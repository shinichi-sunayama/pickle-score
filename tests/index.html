<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pickle-score tests</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 16px; }
  .ok { color: #1a7f37; } .fail { color: #cf222e; font-weight: bold; }
  pre { white-space: pre-wrap; margin: 0 0 0 2em; }
</style>
</head>
<body>
<h1 id="summary">running…</h1>
<ul id="list"></ul>
<script type="module">
  import { runAll } from "./core.test.js";
  const data = await (await fetch("./cases.json")).json();
  const results = runAll(data);
  const list = document.getElementById("list");
  for (const r of results) {
    const li = document.createElement("li");
    li.className = r.ok ? "ok" : "fail";
    li.textContent = `${r.ok ? "ok" : "FAIL"} ${r.name}`;
    if (!r.ok) { const pre = document.createElement("pre"); pre.textContent = r.error; li.append(pre); }
    list.append(li);
  }
  const failed = results.filter((r) => !r.ok).length;
  document.getElementById("summary").textContent = `${results.length - failed} passed, ${failed} failed`;
  window.testResults = { total: results.length, failed, results };
</script>
</body>
</html>
